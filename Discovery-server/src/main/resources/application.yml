server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-server

eureka:
  client:
    # сервак не регистрирует сам себя и не тянет реестр с других серверов
    register-with-eureka: false
    fetch-registry: false
  server:
    # отрубаем self-preservation для кодинга (чтоб упавшие сервисы с реестра грохались)
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info