server:
  port: ${APP_PORT:8081}
  address: ${APP_URL:localhost}

spring:
  application:
    name: notification-service
  config:
    import: ${CONFIG_SERVER:optional:configserver:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}